  <script>
    (function () {
      var reduceMotion = window.matchMedia("(prefers-reduced-motion: reduce)");
      var timer = null;

      function pulseRandomNut() {
        var cells = document.querySelectorAll("#cluster > g.cell:not(.glyph)");
        var cell = cells[Math.floor(Math.random() * cells.length)];
        cell.classList.add("pulse");
        setTimeout(function () {
          cell.classList.remove("pulse");
        }, 900);
        scheduleNext();
      }

      function scheduleNext() {
        timer = setTimeout(pulseRandomNut, 1200 + Math.random() * 2200);
      }

      function start() {
        if (!timer) scheduleNext();
      }
      function stop() {
        clearTimeout(timer);
        timer = null;
      }

      if (!reduceMotion.matches) start();
      reduceMotion.addEventListener("change", function (e) {
        if (e.matches) stop();
        else start();
      });
    })();
  </script>
